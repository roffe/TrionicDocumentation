name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - run: tools/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: out/*.pdf
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" out/*.pdf --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
