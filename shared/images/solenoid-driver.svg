<?xml version="1.0" encoding="UTF-8"?>
<!--
  Solenoid valve driver: N-channel MOSFET low side switch with a flyback
  diode (D1) across the solenoid and a gate pull-down resistor (R).
  T5 book, "Hardware". Drawn on the 344x294 grid of the original picture;
  shown at 45 % of the text width the 11.5 unit labels come out at about
  8.5 pt.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="260" height="292" viewBox="10 0 260 292"
     font-family="DejaVu Sans" font-stretch="condensed">
  <g fill="none" stroke="#000" stroke-width="1.2">
    <!-- +V arrow and main rail down to the drain -->
    <path d="M 145.5 28.5 L 148.5 22 L 151.5 28.5"/>
    <path d="M 148.5 22 V 183.5 H 138.7"/>

    <!-- solenoid branch -->
    <path d="M 148.5 48 H 165 V 57"/>
    <path d="M 165 124 V 149 H 148.5"/>
    <path d="M 165 57
             a 9.5 8.375 0 0 1 0 16.75
             a 9.5 8.375 0 0 1 0 16.75
             a 9.5 8.375 0 0 1 0 16.75
             a 9.5 8.375 0 0 1 0 16.75" stroke-width="2"/>
    <!-- iron core -->
    <path d="M 178 57 V 128 M 182.5 57 V 128"/>

    <!-- MOSFET -->
    <circle cx="142.5" cy="190.3" r="18"/>
    <path d="M 135.4 179 V 201.4 H 66"/>
    <path d="M 138.7 178.5 V 202" stroke-width="2.4"/>
    <path d="M 138.7 197.5 H 148.5 M 143 190.4 H 148.5 V 258.3"/>

    <!-- input -->
    <path d="M 61.3 197.5 L 65.8 201.4 L 61.3 205.3"/>

    <!-- gate pull-down resistor to ground -->
    <path d="M 95 201.4 V 215
             L 101 217.5 L 89 220.5 L 101 223.5 L 89 226.5 L 101 229.5
             L 89 232.5 L 101 235.5 L 89 238.5 L 101 241.5 L 95 244
             V 258.3 H 148.5"/>

    <!-- ground -->
    <path d="M 148.5 258.3 V 275.3
             M 140.5 275.3 H 156.5
             M 143.5 280.7 H 153.5
             M 146.8 286 H 150.2"/>
  </g>

  <!-- D1: cathode bar on top -->
  <path d="M 142.3 88 H 154.7" stroke="#000" stroke-width="1.6"/>
  <path d="M 142.3 101 H 154.7 L 148.5 89 Z" fill="#000"/>

  <!-- MOSFET body arrow, pointing into the channel -->
  <path d="M 139.6 190.4 L 145 187.3 V 193.5 Z" fill="#000"/>

  <!-- junction dots -->
  <g fill="#000">
    <circle cx="148.5" cy="48" r="2.4"/>
    <circle cx="148.5" cy="149" r="2.4"/>
    <circle cx="95" cy="201.4" r="2.4"/>
    <circle cx="148.5" cy="258.3" r="2.4"/>
  </g>

  <g font-size="11.5" fill="#000">
    <text x="148.5" y="14" text-anchor="middle">+V</text>
    <text x="137" y="99" text-anchor="end">D1</text>
    <text x="190" y="99">SOLENOID</text>
    <text x="164" y="194">MOSFET</text>
    <text x="57" y="205.5" text-anchor="end">INPUT</text>
    <text x="72" y="236" text-anchor="end">R</text>
  </g>
  <g font-size="7" fill="#000">
    <text x="144" y="169.5" text-anchor="end">D</text>
    <text x="126" y="210" text-anchor="end">G</text>
    <text x="144" y="217.5" text-anchor="end">S</text>
  </g>
</svg>
