<?xml version="1.0" encoding="UTF-8"?>
<!--
  Standard 10-pin BDM header pinout (Motorola CPU32 background debug mode),
  as seen looking at the pins. Used in the T5/T7/T8 books (BDM technical
  information and "How to connect the PD BDM" appendices).
  Units are points at the size it's printed (134 pt wide, labels 8 pt),
  so its natural size is right too (the side by side layout uses that).
  Signal names with an overline are active low.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="134pt" height="80pt" viewBox="0 0 134 80">
  <!-- header shroud -->
  <rect x="36" y="1.5" width="41" height="77" rx="5" ry="5"
        fill="none" stroke="#000" stroke-width="1"/>

  <!-- pins, odd numbers left, even numbers right -->
  <g fill="none" stroke="#000" stroke-width="0.8">
    <circle cx="48.5" cy="12" r="3"/>  <circle cx="61.5" cy="12" r="3"/>
    <circle cx="48.5" cy="26" r="3"/>  <circle cx="61.5" cy="26" r="3"/>
    <circle cx="48.5" cy="40" r="3"/>  <circle cx="61.5" cy="40" r="3"/>
    <circle cx="48.5" cy="54" r="3"/>  <circle cx="61.5" cy="54" r="3"/>
    <circle cx="48.5" cy="68" r="3"/>  <circle cx="61.5" cy="68" r="3"/>
  </g>

  <!-- pin numbers -->
  <g font-family="DejaVu Sans" font-size="5.5" fill="#000">
    <g text-anchor="middle">
      <text x="41.5" y="14">1</text>
      <text x="41.5" y="28">3</text>
      <text x="41.5" y="42">5</text>
      <text x="41.5" y="56">7</text>
      <text x="41.5" y="70">9</text>
    </g>
    <text x="66.5" y="14">2</text>
    <text x="66.5" y="28">4</text>
    <text x="66.5" y="42">6</text>
    <text x="66.5" y="56">8</text>
    <text x="66.5" y="70">10</text>
  </g>

  <!-- signal names -->
  <g font-family="DejaVu Sans" font-size="8" fill="#000">
    <g text-anchor="end">
      <text x="31" y="14.9" text-decoration="overline">DS</text>
      <text x="31" y="28.9">GND</text>
      <text x="31" y="42.9">GND</text>
      <text x="31" y="56.9" text-decoration="overline">RESET</text>
      <text x="31" y="70.9">V<tspan font-size="5.5" dy="2">DD</tspan></text>
    </g>
    <text x="82" y="14.9" text-decoration="overline">BERR</text>
    <text x="82" y="28.9"><tspan text-decoration="overline">BKPT</tspan>/DSCLK</text>
    <text x="82" y="42.9">FREEZE</text>
    <text x="82" y="56.9"><tspan text-decoration="overline">IFETCH</tspan>/DSI</text>
    <text x="82" y="70.9"><tspan text-decoration="overline">IPIPE</tspan>/DSO</text>
  </g>
</svg>
