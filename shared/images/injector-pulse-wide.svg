<?xml version="1.0" encoding="UTF-8"?>
<!--
  Injector drive signal with wide pulses (more fuel), same period as
  injector-pulse.svg.
  T5 book, "Tuning the T5", image "Wider pulses result in more fuel".
  Shown at 60 % of the text width, the label comes out at about 9 pt.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="290" height="140" viewBox="0 28 290 140"
     font-family="DejaVu Sans" font-stretch="condensed">
  <!-- time axis -->
  <line x1="13" y1="145" x2="278" y2="145" stroke="#a0a0a0" stroke-width="1.6"/>

  <!-- pulses -->
  <path d="M 36 145 V 42 H 125 V 145 M 159 145 V 42 H 248 V 145"
        fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>

  <text x="272" y="160" text-anchor="end" font-size="10" font-weight="bold">time</text>
</svg>
