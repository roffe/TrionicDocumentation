<?xml version="1.0" encoding="UTF-8"?>
<!--
  Measuring the ionization current: (a) principle, a voltage over the spark
  plug gap and measurement electronics in the ground return; (b) as done in
  the ignition cassette, a voltage source and current measurement on the
  low side of the ignition coil secondary.
  "Appendix VII: Knock and misfire detection" in the T5, T7 and T8 books.
  Drawn on the 548x232 grid of the original picture; shown at 80 % of the
  text width the 13 unit labels come out at about 8 pt.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="552" height="236" viewBox="-2 -2 552 236"
     font-family="DejaVu Sans" font-stretch="condensed" font-size="13">

  <!-- ===== (a) principle ===== -->
  <g fill="none" stroke="#000" stroke-width="1.2">
    <!-- cylinder head with gasket, plug and centre electrode -->
    <rect x="8.5" y="74" width="89" height="53.5"/>
    <rect x="11.5" y="127.5" width="81.5" height="5"/>
    <rect x="38.5" y="132.5" width="28" height="7"/>
    <rect x="46.5" y="139.5" width="12" height="6"/>
    <!-- centre conductor, dashed where it runs inside the plug -->
    <path d="M 52.5 74 V 145.5" stroke-dasharray="6 3"/>
    <!-- ground electrode -->
    <path d="M 93 132.5 V 153.5 Q 93 163.5 83.5 163.5 H 41 V 158.5 H 79
             Q 88 158.5 88 150.5 V 132.5"/>
    <!-- current loop through the measurement electronics -->
    <path d="M 52.5 74 V 44.3 H 154.5 V 72.5"/>
    <path d="M 93 129.5 H 152.5"/>
    <path d="M 152.5 118.3 V 170.5"/>
    <path d="M 111.7 39 L 106 44.3 L 111.7 49.6"/>
    <rect x="116" y="72.5" width="89" height="45.8"/>
    <!-- ground -->
    <path d="M 134 170.5 H 171 M 143 174 H 162 M 149 177.5 H 156"/>
    <!-- ions -->
    <path d="M 16 151.3 H 37.5 M 31.3 147.3 L 37.5 151.3 L 31.3 155.3"/>
  </g>
  <text x="110.5" y="32" text-anchor="middle">Ionization current</text>
  <text x="160.5" y="92" text-anchor="middle">Measurement</text>
  <text x="160.5" y="106" text-anchor="middle">electronics</text>
  <text x="0" y="162.5">Ions</text>
  <text x="88" y="228" text-anchor="middle">(a)</text>

  <!-- ===== (b) in the ignition cassette ===== -->
  <g fill="none" stroke="#000" stroke-width="1.2">
    <!-- spark plug -->
    <rect x="261.3" y="50.7" width="7.4" height="10.5"/>
    <rect x="257.3" y="61.2" width="15.7" height="42.4"/>
    <rect x="247.3" y="103.6" width="35.7" height="11.3"/>
    <rect x="254.3" y="114.9" width="22.4" height="12.7"/>
    <rect x="255.3" y="127.6" width="20.4" height="2"/>
    <rect x="263.1" y="130" width="3.3" height="2.6"/>
    <path d="M 275 129.6 V 135.3 Q 275 137 273.3 137 H 262" stroke-width="2"/>

    <!-- coil secondary high side to the plug -->
    <path d="M 265.5 50.7 V 3.3 H 389.5 V 13"/>
    <path d="M 260.5 22 L 265.5 28.3 L 270.5 22"/>
    <!-- plug ground -->
    <path d="M 276.7 128.3 H 297.3 V 199.3"/>
    <path d="M 292.3 157.5 L 297.3 164 L 302.3 157.5"/>
    <path d="M 279.3 199.3 H 316 M 288.3 203.3 H 306 M 295 207.3 H 301"/>

    <!-- ignition coil: secondary (left, to plug), core, primary (right) -->
    <path d="M 389.5 13
             a 9.5 5.125 0 0 1 0 10.25  a 9.5 5.125 0 0 1 0 10.25
             a 9.5 5.125 0 0 1 0 10.25  a 9.5 5.125 0 0 1 0 10.25
             a 9.5 5.125 0 0 1 0 10.25  a 9.5 5.125 0 0 1 0 10.25
             V 96"/>
    <rect x="401.1" y="11.1" width="4.6" height="63.2"/>
    <path d="M 440 4.3 H 417 V 13.6
             a 9 5.12 0 0 0 0 10.24  a 9 5.12 0 0 0 0 10.24
             a 9 5.12 0 0 0 0 10.24  a 9 5.12 0 0 0 0 10.24
             a 9 5.12 0 0 0 0 10.24  a 9 5.12 0 0 0 0 10.24
             V 82.3 H 440"/>

    <rect x="440" y="0.6" width="107.3" height="87.1"/>
    <rect x="318" y="96" width="142" height="77.3"/>
    <!-- ground -->
    <path d="M 389.3 173.3 V 199.3 M 371 199.3 H 407.7 M 380 203.3 H 398.3 M 386.7 207.3 H 392.7"/>
  </g>
  <text x="278" y="29.3">Ionization current</text>
  <text x="262" y="156.7" text-anchor="middle">Ionization</text>
  <text x="262" y="170" text-anchor="middle">current</text>
  <text x="493.7" y="48.5" text-anchor="middle">Ignition timing</text>
  <text x="389" y="130" text-anchor="middle">Voltage source and</text>
  <text x="389" y="145.5" text-anchor="middle">current measurement</text>
  <text x="401.7" y="228" text-anchor="middle">(b)</text>
</svg>
