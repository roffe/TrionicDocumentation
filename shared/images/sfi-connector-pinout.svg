<?xml version="1.0" encoding="UTF-8"?>
<!--
  SFI test connector in Saab 9000 T5 cars, pin locations seen from the
  cable side of the connector. Signal names in purple, pin numbers in black
  (like the original, so "6 15 V" reads as pin 6 = 15 V).
  Used in the CAN bus chapter of the T5 book.
  Drawn on the 266x253 grid of the original picture; printed at 34 % of the
  text width the 14 unit labels come out at about 8 pt.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="232" height="218" viewBox="4 12 232 218">
  <!-- housing: circle r 73 flattened left and right, key slot on the left -->
  <path d="M 96.5 98
           V 80.3
           A 73 73 0 0 1 227.5 80.3
           V 144.7
           A 73 73 0 0 1 96.5 144.7
           V 105
           H 136 V 98 Z"
        fill="none" stroke="#000" stroke-width="1.2"/>

  <!-- terminals -->
  <g fill="none" stroke="#000" stroke-width="1.2">
    <ellipse cx="126" cy="86.5"  rx="14" ry="5.5"/>  <!-- 1 -->
    <ellipse cx="127" cy="141.5" rx="14" ry="5.5"/>  <!-- 2 -->
    <ellipse cx="164" cy="70.5"  rx="14" ry="5.5"/>
    <ellipse cx="164" cy="92.5"  rx="14" ry="5.5"/>  <!-- 4 -->
    <ellipse cx="164" cy="113.5" rx="14" ry="5.5"/>  <!-- 5 -->
    <ellipse cx="164" cy="134.5" rx="14" ry="5.5"/>  <!-- 6 -->
    <ellipse cx="164" cy="156.5" rx="14" ry="5.5"/>
    <rect x="187" y="77"  width="30" height="22" rx="7" ry="7"/>
    <rect x="187" y="102" width="30" height="22" rx="7" ry="7"/>
    <rect x="187" y="127" width="30" height="22" rx="7" ry="7"/>
  </g>

  <!-- leader lines -->
  <g stroke="#000" stroke-width="1">
    <line x1="87.5"  y1="39"    x2="117.5" y2="82"/>     <!-- CAN-H 1 -->
    <line x1="130"   y1="40"    x2="155"   y2="88.5"/>   <!-- 4 IGN -->
    <line x1="83"    y1="113.5" x2="150"   y2="113.5"/>  <!-- GND 5 -->
    <line x1="95"    y1="187.5" x2="117.5" y2="147.5"/>  <!-- CAN-L 2 -->
    <line x1="124"   y1="204"   x2="154"   y2="139"/>    <!-- 6 15 V -->
  </g>

  <g font-family="DejaVu Sans" font-size="14">
    <!-- signal names -->
    <g fill="#5c3c92">
      <text x="20"  y="35">CAN-H</text>
      <text x="139" y="29.5">IGN</text>
      <text x="10"  y="118.5">GND</text>
      <text x="26"  y="204">CAN-L</text>
      <text x="129" y="222">15 V</text>
    </g>
    <!-- pin numbers -->
    <g fill="#000">
      <text x="74"  y="35">1</text>
      <text x="119" y="29.5">4</text>
      <text x="60"  y="118.5">5</text>
      <text x="80"  y="204">2</text>
      <text x="117" y="222">6</text>
    </g>
  </g>
</svg>
