<?xml version="1.0" encoding="UTF-8"?>
<!--
  OBD-II (SAE J1962) 16-pin diagnostic socket, pin numbering as seen
  looking into the socket in the car. Used in the CAN bus chapter of the
  T7 and T8 books.
  Drawn on the 270x105 grid of the original picture; printed at 44 % of the
  text width the 12 unit pin numbers come out at about 8.5 pt.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
     width="263" height="97" viewBox="4 2 263 97">
  <defs>
    <!-- one pin position: upper cavity with its neck, lower neck and cavity.
         The pitch between pins is 28.1 -->
    <g id="slot">
      <rect x="0"   y="15" width="17.6" height="20"/>
      <rect x="4.8" y="34" width="8"    height="7"/>
      <rect x="4.8" y="60" width="8"    height="9"/>
      <rect x="0"   y="68" width="17.6" height="20"/>
    </g>
    <!-- the black ribs between two pins stick a bit into the middle channel -->
    <g id="rib">
      <rect x="0" y="39" width="10.5" height="5"/>
      <rect x="0" y="57" width="10.5" height="5"/>
    </g>
  </defs>

  <!-- body -->
  <path d="M 23 4 H 249
           C 259 4, 265 10, 264 22
           L 250 90
           C 249 94, 246 97, 241 97
           H 31
           C 26 97, 23 94, 22 90
           L 7 22
           C 6 10, 12 4, 23 4 Z"
        fill="#000"/>

  <!-- openings -->
  <g fill="#fff">
    <rect x="28.8" y="40" width="214.3" height="21"/>
    <use xlink:href="#slot" x="28.8"/>
    <use xlink:href="#slot" x="56.9"/>
    <use xlink:href="#slot" x="85.0"/>
    <use xlink:href="#slot" x="113.1"/>
    <use xlink:href="#slot" x="141.2"/>
    <use xlink:href="#slot" x="169.3"/>
    <use xlink:href="#slot" x="197.4"/>
    <use xlink:href="#slot" x="225.5"/>
  </g>
  <g fill="#000">
    <use xlink:href="#rib" x="46.4"/>
    <use xlink:href="#rib" x="74.5"/>
    <use xlink:href="#rib" x="102.6"/>
    <use xlink:href="#rib" x="130.7"/>
    <use xlink:href="#rib" x="158.8"/>
    <use xlink:href="#rib" x="186.9"/>
    <use xlink:href="#rib" x="215.0"/>
  </g>

  <!-- pin numbers, centred in the cavities -->
  <g font-family="DejaVu Sans" font-size="12" fill="#000" text-anchor="middle">
    <text x="37.6"  y="29.4">1</text>
    <text x="65.7"  y="29.4">2</text>
    <text x="93.8"  y="29.4">3</text>
    <text x="121.9" y="29.4">4</text>
    <text x="150.0" y="29.4">5</text>
    <text x="178.1" y="29.4">6</text>
    <text x="206.2" y="29.4">7</text>
    <text x="234.3" y="29.4">8</text>
    <text x="37.6"  y="82.4">9</text>
    <text x="65.7"  y="82.4">10</text>
    <text x="93.8"  y="82.4">11</text>
    <text x="121.9" y="82.4">12</text>
    <text x="150.0" y="82.4">13</text>
    <text x="178.1" y="82.4">14</text>
    <text x="206.2" y="82.4">15</text>
    <text x="234.3" y="82.4">16</text>
  </g>
</svg>
