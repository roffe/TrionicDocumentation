<?xml version="1.0" encoding="UTF-8"?>
<!--
  Crankshaft position sensors: variable reluctance sensor (top, T5.5) and
  Hall effect sensor (bottom, T5.2) in front of a toothed wheel, with their
  wiring and output signals.
  T5 book, "Maps" (crankshaft position sensor) and "Appendix VIII: Sensors
  and actuators". Drawn on the 700x638 grid of the original picture; shown
  at 81 % of the text width the 16 unit labels come out at about 8 pt.
  The Hall half is the VR half moved down 332 units.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
     width="700" height="638" viewBox="0 0 700 638"
     font-family="DejaVu Sans" font-stretch="condensed" font-size="16">
  <rect x="1" y="1" width="698" height="636" fill="none" stroke="#000" stroke-width="2"/>

  <!-- ===== toothed wheel + sensor body, drawn once for each half ===== -->
  <g id="wheel-and-sensor" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="miter">
    <!-- shaft -->
    <circle cx="59" cy="153.5" r="32"/>
    <!-- part of the trigger wheel (centre on the shaft, 5 teeth) -->
    <path d="M 93.3 25.5
             A 132.5 132.5 0 0 1 120.4 36.1 L 129.4 22.1 L 150.4 35.8 L 141.3 49.7
             A 132.5 132.5 0 0 1 169.0 79.6 L 183.5 71.7 L 195.5 93.6 L 180.9 101.5
             A 132.5 132.5 0 0 1 190.9 141.0 L 207.5 141.0 L 207.5 166.0 L 190.9 166.0
             A 132.5 132.5 0 0 1 180.9 205.5 L 195.5 213.4 L 183.5 235.3 L 169.0 227.4
             A 132.5 132.5 0 0 1 141.3 257.3 L 150.4 271.2 L 129.4 284.9 L 120.4 270.9
             A 132.5 132.5 0 0 1 93.3 281.5"/>
    <!-- break marks where the wheel is cut off -->
    <path d="M 91.5 32.3 C 88.9 26.4 97.7 24.6 95.1 18.8
             M 91.5 274.7 C 96.6 278.5 89.9 284.5 95.1 288.2"/>
    <!-- sensor: nose, flange, body -->
    <rect x="218" y="138" width="42" height="31"/>
    <rect x="260" y="126.5" width="11" height="74.5"/>
    <rect x="271" y="131.5" width="31.5" height="42.5"/>
  </g>
  <use xlink:href="#wheel-and-sensor" y="332"/>

  <!-- ===== variable reluctance sensor ===== -->
  <text x="212" y="66" font-size="17.5" font-weight="bold">VARIABLE RELUCTANCE SENSOR</text>

  <g fill="none" stroke="#000" stroke-width="1.6">
    <path d="M 302.5 142.5 H 325 V 110.8 H 451"/>
    <path d="M 302.5 163.5 H 325 V 195.5 H 451"/>
    <!-- 2.7 kOhm across the coil -->
    <path d="M 430.5 110.8 V 124 L 420 129.7 L 441 137.5 L 420 145.5 L 441 153.3
             L 420 161.3 L 441 169 L 420 177 L 430.5 182 V 195.5"/>
    <!-- output terminals -->
    <path d="M 451 105.5 L 462.5 110.8 L 451 116.1 Z"/>
    <path d="M 451 190.2 L 462.5 195.5 L 451 200.8 Z"/>
    <!-- output signal -->
    <path d="M 482.5 152.5 H 632.5" stroke-width="1.2"/>
    <path d="M 487.5 162.4
             C 489.2 159.2 490.8 155.9 492.5 152.5
             C 500.0 137.3 507.5 123.5 515.0 123.5
             C 522.5 123.5 530.0 137.3 537.5 152.5
             C 545.0 167.7 552.5 181.5 560.0 181.5
             C 567.5 181.5 575.0 167.7 582.5 152.5
             C 590.0 137.3 597.5 123.5 605.0 123.5
             C 612.5 123.5 620.0 137.3 627.5 152.5
             C 628.7 154.9 629.8 157.2 631.0 159.5"/>
    <!-- peak-peak -->
    <path d="M 605 123.5 H 653 M 567.5 181.5 H 653 M 650 131 V 174" stroke-width="1.2"/>
  </g>
  <path d="M 650 123.5 L 646 133 H 654 Z M 650 181.5 L 646 172 H 654 Z" fill="#000"/>

  <text x="466.5" y="116.5">SIGNAL</text>
  <text x="466.5" y="201.5">RETURN</text>
  <text x="341" y="155">2.7K OHM</text>
  <text x="462.5" y="158">0V</text>
  <text x="599" y="96">MINIMUM 2V</text>
  <text x="599" y="111">PEAK-PEAK</text>
  <text x="261" y="227.5">ECM TRIGGERS ON FALLING EDGE OF SIGNAL</text>
  <text x="261" y="241.5">CORRESPONDING TO EDGE OF TOOTH MOVING</text>
  <text x="261" y="255.5">AWAY FROM SENSOR CENTERLINE</text>

  <!-- ===== Hall effect sensor ===== -->
  <text x="190" y="359" font-size="17.5" font-weight="bold">HALL EFFECT SENSOR</text>

  <g fill="none" stroke="#000" stroke-width="1.6">
    <!-- supply with 1 kOhm pull-up on the signal -->
    <path d="M 302.5 474 H 325 V 400 H 430.5"/>
    <path d="M 430.5 387 V 413 L 420 419 L 441 427 L 420 435 L 441 443 L 420 451
             L 441 459 L 420 467 L 430.5 471 V 485.6"/>
    <path d="M 425 387 L 430.5 376 L 436 387 Z"/>
    <!-- signal and ground -->
    <path d="M 302.5 485.6 H 451"/>
    <path d="M 451 480.3 L 462.5 485.6 L 451 490.9 Z"/>
    <path d="M 302.5 495 H 325 V 527.5"/>
    <path d="M 320 527.5 H 330 L 325 537.5 Z"/>
    <!-- output signal -->
    <path d="M 485 464 H 494 V 422.5 H 536.5 V 464 H 579 V 422.5 H 621.5 V 464 H 632.5"/>
  </g>

  <text x="431" y="371.5" text-anchor="middle">+5V</text>
  <text x="358" y="450">1K OHM</text>
  <text x="466.5" y="491.5">SIGNAL</text>
  <text x="295" y="555">GROUND</text>
  <text x="456" y="430">+5V</text>
  <text x="462.5" y="471">0V</text>
  <text x="266" y="579">ECM TRIGGERS ON RISING EDGE OF SIGNAL</text>
  <text x="266" y="593.5">CORRESPONDING TO EDGE OF TOOTH MOVING</text>
  <text x="266" y="608">AWAY FROM SENSOR CENTERLINE</text>
</svg>
